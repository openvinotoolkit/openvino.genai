# Test matrix for the macOS genai_tests_wheel job.
# Each entry runs when any of its `components` is affected (has `.test`).
- name: ASR
  # TODO: skip some tests temporary until https://github.com/huggingface/datasets/issues/7647 dataset is fixed
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_whisper_pipeline.py -m "not transformers_lower_v5"
  timeout: 120
  components:
    - automatic_speech_recognition

- name: ASR (Qwen3-ASR)
  cmd: |-
    # optimum intel master commit with Qwen3-ASR support
    python -m pip install --no-deps --force-reinstall "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@f48d93fddff8c91e198389c47a6d5974789b67f4"
    python -m pip install transformers==4.57.6 qwen-asr==0.0.6
    python -m pytest -s -v ./tests/python_tests/test_whisper_pipeline.py -k "qwen3-asr"
  timeout: 60
  components:
    - automatic_speech_recognition

