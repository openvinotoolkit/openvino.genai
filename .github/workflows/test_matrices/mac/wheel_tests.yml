- name: GGUF Reader tests
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_gguf_reader.py
  timeout: 60
  components:
    - GGUF
    - LLM

- name: Tokenizer tests
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_tokenizer.py
  timeout: 60
  components:
    - tokenizers

