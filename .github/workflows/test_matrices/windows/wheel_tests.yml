# Test matrix for the Windows genai_tests_wheel job.
# Each entry runs when any of its `components` is affected (has `.test`).
- name: ASR
  cmd: |-
    python -m pytest -s -v tests/python_tests/test_whisper_pipeline.py -m "not transformers_lower_v5"
  timeout: 120
  components:
    - automatic_speech_recognition

- name: ASR static with Transformers 5.0
  cmd: |-
    # Transformers 5.5 is failing, pin 5.0 for now; tracking issue CVS-194253.
    python -m pip install transformers==5.0.0
    python -m pytest -s -v tests/python_tests/test_whisper_pipeline_static.py -m "not transformers_lower_v5"
  timeout: 120
  components:
    - automatic_speech_recognition

- name: ASR Transformers under 5.0
  cmd: |-
    python -m pip install transformers==4.57.6
    python -m pytest -v ./tests/python_tests/test_whisper_pipeline.py ./tests/python_tests/test_whisper_pipeline_static.py -m "transformers_lower_v5"
  timeout: 120
  components:
    - automatic_speech_recognition

- name: ASR (Qwen3-ASR pipeline)
  cmd: |-
    python -m pip install transformers==4.57.6 qwen-asr==0.0.6
    python -m pytest -v tests/python_tests/test_whisper_pipeline.py -k "qwen3-asr" -m "not qwen3_asr_split_export"
  timeout: 20
  components:
    - automatic_speech_recognition

- name: ASR (Qwen3-ASR forced aligner)
  cmd: |-
    python -m pip install transformers==4.57.6 qwen-asr==0.0.6
    python -m pytest -v tests/python_tests/test_asr_forced_aligner.py
  timeout: 20
  components:
    - automatic_speech_recognition

- name: ASR (Qwen3-ASR split export)
  cmd: |-
    python -m pip install transformers==4.57.6 qwen-asr==0.0.6
    python -m pip install --no-deps "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@d304fb56602d878547c3d416e875c02cfd5e5479"
    python -m pytest -v tests/python_tests/test_whisper_pipeline.py -k "qwen3-asr" -m qwen3_asr_split_export
  timeout: 20
  components:
    - automatic_speech_recognition

- name: ASR (Fun-ASR)
  cmd: |-
    python -m pip install transformers==4.57.6 funasr==1.4.1
    python -m pytest -v tests/python_tests/test_whisper_pipeline.py -k "fun-asr"
  timeout: 20
  components:
    - automatic_speech_recognition

- name: ASR (SenseVoice)
  cmd: |-
    python -m pip install transformers==4.57.6 funasr==1.4.1
    python -m pip install --no-deps "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@8ea11468f26fa491e8068d63548b31f4dfb6ac6f"
    $env:GENAI_REQUIRE_SENSEVOICE = "1"
    python -m pytest -v tests/python_tests/test_whisper_pipeline.py -m sensevoice
  timeout: 40
  components:
    - automatic_speech_recognition

- name: Cacheopt E2E (Part 1)
  cmd: |-
    python -m pytest -s -v tests/python_tests/test_kv_cache_eviction/test_kv_cache_eviction_1.py
  timeout: 180
  components:
    - continuous_batching

- name: Cacheopt E2E (Part 2)
