- name: Qwen3-VL
  extra_cmd: >-
    python -m pip install transformers==5.0.0 &&
    python -m pip install --no-deps "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@b254b32cd9c18ad3bfa6fbe41267cf3b6fabba38"
  marker: qwen3_vl
  cmd: tests/python_tests/samples
  runner: aks-linux-4-cores-16gb
  components:
    - VLM_samples

- name: Eagle3 decoding
  extra_cmd: >-
    python -m pip install transformers==4.57.6 &&
    python -m pip install --no-deps "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@b254b32cd9c18ad3bfa6fbe41267cf3b6fabba38"
  marker: eagle3_decoding
  cmd: tests/python_tests/samples
  runner: aks-linux-4-cores-16gb
  components:
    - speculative_decoding

- name: LLM with transformers under 5.0
  extra_cmd: python -m pip install transformers==4.57.6 diffusers==0.37.1
  marker: llm and (transformers_dependent or transformers_lower_v5)
  cmd: tests/python_tests/samples
  runner: aks-linux-4-cores-16gb
  components:
    - LLM_samples
