# Test matrix for the genai_tests_wheel job.
# Each entry runs when any of its `components` is affected (has `.test`).
- name: ASR
  # TODO: skip some tests temporary untill https://github.com/huggingface/datasets/issues/7647 dataset is fixed
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_whisper_pipeline.py ./tests/python_tests/test_whisper_pipeline_static.py -m "not transformers_lower_v5"
  timeout: 45
  components:
    - automatic_speech_recognition

- name: ASR Transformers under 5.0
  cmd: |-
    python -m pip install transformers==4.57.6
    python -m pytest -v ./tests/python_tests/test_whisper_pipeline.py ./tests/python_tests/test_whisper_pipeline_static.py -m "transformers_lower_v5"
  timeout: 45
  components:
    - automatic_speech_recognition

- name: ASR (Qwen3-ASR)
  cmd: |-
    # optimum intel master commit with Qwen3-ASR support
    python -m pip install --no-deps --force-reinstall "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@f48d93fddff8c91e198389c47a6d5974789b67f4"
    python -m pip install transformers==4.57.6 qwen-asr==0.0.6
    python -m pytest -v ./tests/python_tests/test_whisper_pipeline.py -k "qwen3-asr"
  timeout: 20
  components:
    - automatic_speech_recognition

- name: ASR (Fun-ASR)
  cmd: |-
    # optimum intel master commit with Fun-ASR support
    python -m pip install --no-deps --force-reinstall "optimum-intel @ git+https://github.com/huggingface/optimum-intel.git@e1de5beecfd0c3ae6047ea22cea4a4cad4307aff"
    python -m pip install transformers==4.57.6 funasr==1.4.1
    python -m pytest -v ./tests/python_tests/test_whisper_pipeline.py -k "fun-asr"
  timeout: 20
  components:
    - automatic_speech_recognition

- name: Cacheopt E2E (Part 1)
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_kv_cache_eviction/test_kv_cache_eviction_1.py
  timeout: 180
  components:
    - continuous_batching

- name: Cacheopt E2E (Part 2)
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_kv_cache_eviction/test_kv_cache_eviction_2.py
  timeout: 360
  components:
    - continuous_batching

- name: Cacheopt E2E (xattention)
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_sparse_prefill.py
  timeout: 180
  components:
    - continuous_batching

- name: LLM
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_llm_pipeline.py tests/python_tests/test_llm_pipeline_static.py tests/python_tests/test_structured_output.py tests/python_tests/test_image_generation.py tests/python_tests/test_image_generation_multi_call.py -m "not transformers_lower_v5" --override-ini cache_dir=/mount/caches/pytest/
  timeout: 90
  components:
    - LLM
    - Image_generation

- name: VLM (match_optimum_with_resolutions)
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_vlm_pipeline.py -k "test_vlm_pipeline_match_optimum_with_resolutions" --override-ini cache_dir=/mount/caches/pytest/
  timeout: 90
  components:
    - visual_language

- name: VLM
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_vlm_pipeline.py -k "not test_vlm_pipeline_match_optimum_with_resolutions and not videochat and not qwen3-vl and not eagle3" -m "not transformers_lower_v5" --override-ini cache_dir=/mount/caches/pytest/
  timeout: 90
  components:
    - visual_language

- name: Video Generation
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_video_generation.py --override-ini cache_dir=/mount/caches/pytest/
  timeout: 60
  components:
    - video_generation

- name: Kokoro TTS
  cmd: |-
    python -m pytest -s -v tests/python_tests/test_kokoro_pipeline.py
  timeout: 60
  components:
    - speech_generation

- name: Misaki C++ Parity
  cmd: |-
    rm -rf ./build_misaki_cpp_ci
    unset CMAKE_CXX_COMPILER_LAUNCHER
    unset CMAKE_C_COMPILER_LAUNCHER
    cmake -S ./src/cpp/src/speech_generation/misaki_cpp -B ./build_misaki_cpp_ci -DMISAKI_CPP_BUILD_PYTHON_BINDINGS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER:STRING= -DCMAKE_C_COMPILER_LAUNCHER:STRING=
    cmake --build ./build_misaki_cpp_ci --target misaki_cpp_py --parallel
    export PYTHONPATH="./build_misaki_cpp_ci:./build_misaki_cpp_ci/Release:${PYTHONPATH}"
    python -m pytest -s -v src/cpp/src/speech_generation/misaki_cpp/tests/test_misaki_cpp_parity.py
  timeout: 30
  components:
    - speech_generation

- name: GGUF Reader tests
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_gguf_reader.py
  timeout: 60
  components:
    - GGUF
    - LLM

- name: Tokenizer tests
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_tokenizer.py
  timeout: 60
  components:
    - tokenizers

- name: API tests
  cmd: |-
    python -m pytest -v ./tests/python_tests/test_continuous_batching.py -k "not eagle3 and not qwen35_mtp and not transformers_lower_v5" ./tests/python_tests/test_generation_config.py ./tests/python_tests/test_sampling.py ./tests/python_tests/test_text_streamer.py
  timeout: 60
  components:
    - continuous_batching
    - sampling
    - text_streamer

- name: Rag tests
  # Pin optimum which supports qwen3-vl-embedding
  cmd: |-
    python -m pip install "git+https://github.com/huggingface/optimum-intel.git@f48d93fddff8c91e198389c47a6d5974789b67f4#egg=optimum-intel"
    python -m pytest -v ./tests/python_tests/test_rag.py
  timeout: 35
  components:
    - RAG

- name: WWB tests
