fail-on-severity: "low"
allow-licenses:
  - "BSD-2-Clause"
  - "BSD-3-Clause"
  - "MIT"
  - "MIT-0"
  - "Apache-2.0"
  - "ISC"
  - "BlueOak-1.0.0"
  - "0BSD"
  - "Python-2.0"
  - "MIT-CMU" # Pillow's license
  - "CC-BY-NC-4.0"
  - "CC-BY-4.0"
  - "GPL-1.0-or-later"
  - "LGPL-2.0-or-later"
  - "LicenseRef-scancode-proprietary-license"
  - "LicenseRef-scancode-unicode"
fail-on-scopes:
  - "runtime"
  - "development"
  - "unknown"
license-check: true
vulnerability-check: true
allow-ghsas:
  # Transformers 5.10.0 fixes this issue, but the pinned Optimum Intel revision requires transformers<5.6.
  # The existing transformers 5.0.0 baseline is also affected, so this upgrade does not introduce the vulnerability.
  - "GHSA-xrqw-3rrv-vx5w"
allow-dependencies-licenses:
  - "pkg:npm/thingies" # Docs site (dependency of dependency)
  - "pkg:npm/flatted" # Docs site (dependency of dependency)
  - "pkg:pypi/PyGithub" # Dependencies of the workflow rerunner script
  - "pkg:pypi/psycopg2-binary"
