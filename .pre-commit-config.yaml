exclude: |
  (?x)(
    \.pyi$|
    ^tools/llm_bench/prompts/|
    ^tools/who_what_benchmark/whowhatbench/prompts/
  )
repos:
  - repo: meta
    hooks:
      - id: identity
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(py|c|cpp|h|hpp)$'
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-ast
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
  - repo: https://github.com/akaihola/darker
    rev: v3.0.0
    hooks:
      - id: darker
        args: ["--formatter=ruff"]
        additional_dependencies:
          - ruff==0.14.4
          - tomli==2.3.0
  - repo: local
    hooks:
      - id: git-clang-format
        name: git-clang-format
        entry: git-clang-format --binary clang-format --extensions=c,cc,cpp,cxx,h,hpp,hxx --style=file
        language: python
        additional_dependencies:
          - clang-format==23.1.0
        files: \.(c|cc|cpp|cxx|h|hpp|hxx)$
        pass_filenames: false
