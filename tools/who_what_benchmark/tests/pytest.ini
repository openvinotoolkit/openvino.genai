[pytest]

markers =
    nanollava: VLM tests that require the nanoLLaVA stack (older transformers/diffusers).
    transformers_lower_v5: tests that require transformers < 5.0.
    transformers_dependent: tests sensitive to the installed transformers version.
    gguf_small: GGUF accuracy tests whose model download stays under ~1 GB, so they fit a CI runner.
